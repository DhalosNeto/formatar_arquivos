name: formatador

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: api
    environment:
      PORTA: "8080"
      AMBIENTE: desenvolvimento
      NIVEL_LOG: debug
      POSTGRES_DSN: postgres://formatador:formatador@postgres:5432/formatador?sslmode=disable
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: documentos
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      CONVERSOR_URL: http://libreoffice:2004
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: formatador-api
      CORS_ORIGENS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      libreoffice:
        condition: service_healthy
    networks: [default, sem-saida]
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      target: worker
    environment:
      AMBIENTE: desenvolvimento
      NIVEL_LOG: debug
      POSTGRES_DSN: postgres://formatador:formatador@postgres:5432/formatador?sslmode=disable
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: documentos
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      CONVERSOR_URL: http://libreoffice:2004
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: formatador-worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      libreoffice:
        condition: service_healthy
    networks: [default, sem-saida]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      VITE_API_URL: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: formatador
      POSTGRES_PASSWORD: formatador
      POSTGRES_DB: formatador
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formatador -d formatador"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /dados --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dados:/dados
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  criar-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/documentos &&
      mc anonymous set none local/documentos &&
      echo 'bucket documentos pronto (sem acesso anônimo)'
      "

  # Conversão DOCX -> PDF. Sidecar próprio, não imagem de terceiro: ver
  # deploy/Dockerfile.libreoffice para o contrato HTTP e o porquê da troca.
  #
  # SEM porta publicada no host, de propósito. Publicar 2004 dava a qualquer
  # processo do host uma rota direta ao conversor, contornando toda a
  # validação de formato que a API faz antes de converter. O sidecar só é
  # alcançável por api e worker, pela rede interna. Para depurar à mão, use
  # `podman compose exec libreoffice ...` em vez de reabrir a porta.
  #
  # SEM saída para a internet (rede `sem-saida`, internal: true). Um DOCX
  # malicioso pode carregar referência remota (OLE, imagem por URL) que o
  # LibreOffice tenta buscar ao renderizar — é vetor de SSRF e de
  # exfiltração do conteúdo do documento. Sem rota de saída, a busca falha.
  # api e worker ficam nas DUAS redes: perderiam o sidecar se ficassem só na
  # padrão, e perderiam Postgres/MinIO/Jaeger se ficassem só na isolada.
  libreoffice:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.libreoffice
    networks: [sem-saida]
    # Teto de recursos: uma renderização do LibreOffice é o processo mais
    # pesado do compose. Sem teto, um documento patológico leva o host junto.
    # Combina com PDFCONV_MAXIMO_SIMULTANEAS no handler: o semáforo evita
    # chegar no limite, e o limite é a rede de segurança se o semáforo estiver
    # mal dimensionado.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    environment:
      PDFCONV_MAXIMO_SIMULTANEAS: "2"
      PDFCONV_PRAZO_SEGUNDOS: "120"
    # /saude faz uma chamada RPC de verdade ao unoserver, não um teste de
    # porta aberta: o LibreOffice aceita conexão antes de conseguir converter.
    # Por isso start_period é generoso — subida fria leva dezenas de segundos,
    # e sem ele api e worker desistiriam antes do sidecar ficar pronto.
    #
    # python3 em vez de curl porque a imagem tem o interpretador (python3-uno)
    # e não tem curl; instalar um binário só para o health check aumentaria a
    # superfície de um container que processa documento de usuário.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:2004/saude', timeout=5).status == 200 else 1)"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  prometheus:
    image: docker.io/prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas:/etc/prometheus/alertas:ro
    ports:
      - "9090:9090"

  grafana:
    image: docker.io/grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_dados:/var/lib/grafana
    depends_on:
      - prometheus

networks:
  default:
  # internal: true remove a rota de saída: containers nesta rede falam entre
  # si e com mais ninguém. É o controle que impede o LibreOffice de buscar
  # conteúdo remoto embutido num documento do usuário.
  sem-saida:
    internal: true

volumes:
  postgres_dados:
  minio_dados:
  grafana_dados:
